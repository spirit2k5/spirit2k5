name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.css"
      - "**.js"
      - "sitemap.xml"
      - "robots.txt"
      - "CNAME"
      - "38c485090bb1b3a3720b1cba8c55319e.txt"\n      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spirit2k5-indexnow
  cancel-in-progress: true

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path

          key = "38c485090bb1b3a3720b1cba8c55319e"
          sitemap = Path("sitemap.xml").read_text(encoding="utf-8")
          urls = re.findall(r"<loc>(https://spirit2k5\.co\.za/[^<]*)</loc>", sitemap)

          payload = {
              "host": "spirit2k5.co.za",
              "key": key,
              "keyLocation": f"https://spirit2k5.co.za/{key}.txt",
              "urlList": urls,
          }

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print(f"IndexNow status: {response.status}")
                  if response.status not in (200, 202):
                      raise SystemExit(f"Unexpected IndexNow response: {response.status}")
          except urllib.error.HTTPError as error:
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
