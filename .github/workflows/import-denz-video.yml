name: Import Denz showcase video
on:
  push:
    paths:
      - ".github/workflows/import-denz-video.yml"
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized Denz showcase
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 "https://d2ol7oe51mr4n9.cloudfront.net/user_3Jbee8EKIFpMZvmAVWNuk1nI7Zb/03c65c0d-04b1-4e91-af7f-2fa6207ad72f.mp4" -o assets/denz-iphones-showcase.mp4
          test -s assets/denz-iphones-showcase.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/denz-iphones-showcase.mp4
          if git diff --cached --quiet; then
            echo "Video already present."
            exit 0
          fi
          git commit -m "Add Denz iPhones showcase video"
          git push
