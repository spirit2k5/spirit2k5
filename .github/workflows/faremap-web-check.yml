name: FareMap passenger web checks

on:
  push:
    branches: [main]
    paths:
      - 'faremap/**'
      - '.github/workflows/faremap-web-check.yml'
  pull_request:
    paths:
      - 'faremap/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Check passenger script syntax
        run: node --check faremap/app.js
      - name: Validate passenger page and HUD
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.nav = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if attrs.get('data-nav'): self.nav.append(attrs['data-nav'])
                  if tag in ('a','link','script') and any(x in attrs for x in ('href','src')):
                      self.links.append(attrs.get('href') or attrs.get('src'))
          markup = Path('faremap/index.html').read_text(encoding='utf-8')
          js = Path('faremap/app.js').read_text(encoding='utf-8')
          css = Path('faremap/mobile-ui.css').read_text(encoding='utf-8')
          p = Page()
          p.feed(markup)
          duplicates = [k for k,v in Counter(p.ids).items() if v > 1]
          assert not duplicates, f'Duplicate IDs: {duplicates}'
          for required in ('appSection','authSection','fmHomeView','fmBottomNav',
                           'view-fares','view-points','view-profile','fmAddSheet',
                           'emailLinkBtn','googleBtn','profileQuickBtn','themeToggleBtn',
                           'fareResults','pointResults','fmHomeMap','homeSearchBtn'):
              assert required in p.ids, f'Missing critical UI node: {required}'
          assert p.nav == ['home','fares','add','points','profile'], p.nav
          assert '/faremap/mobile-ui.css?v=20261018-native1' in p.links
          assert '/faremap/app.js' in p.links
          assert 'getElementById' in js
          assert 'signInWithOtp' in js and 'signInWithOAuth' in js
          assert 'fare_prices' in js and 'pickup_points' in js
          assert 'service_role' not in js
          assert '.fm-bottom-nav' in css and '--fm-green:#13A957' in css
          print('FareMap passenger layout and source checks passed')
          PY
