name: FareMap passenger web checks

on:
  push:
    branches: [main]
    paths:
      - 'faremap/**'
      - '.github/workflows/faremap-web-check.yml'
  pull_request:
    paths:
      - 'faremap/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4
      - name: Use supported Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check passenger scripts and journey tests
        run: |
          node --check faremap/app.js
          node --check faremap/passenger-v2.js
          node --check faremap/passenger-map.js
          node --check faremap/maplibre-runtime.js
          node --check faremap/vendor/maplibre-gl.mjs
          node --check faremap/vendor/maplibre-gl-worker.mjs
          node --check faremap/web-auth.js
          node --test faremap/tests/*.test.mjs
      - name: Validate passenger page and HUD
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from collections import Counter
          from pathlib import Path

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.nav = []
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if attrs.get('id'): self.ids.append(attrs['id'])
                  if attrs.get('data-nav'): self.nav.append(attrs['data-nav'])
                  if tag in ('a','link','script') and any(x in attrs for x in ('href','src')):
                      self.links.append(attrs.get('href') or attrs.get('src'))
          markup = Path('faremap/index.html').read_text(encoding='utf-8')
          js = Path('faremap/app.js').read_text(encoding='utf-8')
          css = Path('faremap/mobile-ui.css').read_text(encoding='utf-8')
          p = Page()
          p.feed(markup)
          duplicates = [k for k,v in Counter(p.ids).items() if v > 1]
          assert not duplicates, f'Duplicate IDs: {duplicates}'
          for required in ('appSection','authSection','fmHomeView','fmBottomNav',
                           'view-fares','view-points','view-profile','fmAddSheet',
                           'emailLinkBtn','googleBtn','profileQuickBtn','themeToggleBtn',
                           'fareResults','pointResults','fmHomeMap','homeSearchBtn'):
              assert required in p.ids, f'Missing critical UI node: {required}'
          assert p.nav == ['home','fares','add','points','profile'], p.nav
          local_paths = [link.split('?')[0].split('#')[0] for link in p.links]
          for link in local_paths:
              if link.startswith('/'):
                  target = Path(link.lstrip('/'))
                  if link.endswith('/'): target /= 'index.html'
                  assert target.is_file(), f'Missing local resource: {link}'
          assert '/faremap/mobile-ui.css' in local_paths
          assert '/faremap/app.js' in local_paths
          assert '/faremap/passenger-v2.css' in local_paths
          assert '/faremap/map-native.css' in local_paths
          assert '/faremap/vendor/maplibre-gl.css' in local_paths
          assert 'maplibre-runtime.js' in js
          import xml.etree.ElementTree as ET
          sprite = ET.parse('faremap/assets/native-map-icons.svg')
          symbols = {node.attrib.get('id') for node in sprite.iter()}
          for icon in ('bus','location','location-outline','map-outline','locate-outline',
                       'layers-outline','expand-outline','close','chevron-forward','add','remove'):
              assert icon in symbols, f'Missing native icon: {icon}'
          for required in ('emailCodeSection','emailCode','verifyEmailCodeBtn'):
              assert required in p.ids, f'Missing email-code UI: {required}'
          assert '/faremap/help.html' in local_paths and '/faremap/privacy.html' in local_paths
          for required in ('view-planner','v2Map','v2ReportModal','v2ReportSubmit','v2PlanFrom','v2PlanTo'):
              assert required in p.ids, f'Missing FareMap V2 UI node: {required}'
          assert 'getElementById' in js
          assert 'signInWithOtp' in js and 'signInWithOAuth' in js
          assert 'faremap_public_passenger_catalog' in js
          assert 'passenger-v2.js' in js
          assert 'faremap_get_data_confidence' in Path('faremap/passenger-v2.js').read_text(encoding='utf-8')
          assert 'faremap_report_data_issue_as' in Path('faremap/passenger-v2.js').read_text(encoding='utf-8')
          assert 'service_role' not in js
          assert '.fm-bottom-nav' in css and '--fm-green:#13A957' in css
          print('FareMap passenger layout and source checks passed')
          PY
